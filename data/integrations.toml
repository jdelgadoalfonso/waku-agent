# Every user-configurable connection Waku offers, as data.
#
# Adding one is a row here, a logo at data/static/logos/<key>.svg, and one
# entry in each half's behaviour table: `_BEHAVIOUR` in waku/integrations.py
# for Python, `BEHAVIOUR` in nim/src/integrations.nim for Nim. The closures a
# row cannot carry as data (`enabled`, `probe`, `normalize`) live there, keyed
# by row key, and a row marked for a half with no entry is refused by name.
# The Connections panel, the health probes, the gateway wiring and the
# Connections block of .env.example are all built from the rows below.
#
# Fields
#   halves        which halves register this row: "python", "nim", or both.
#                 It names the halves that HAVE the row, and nothing more: it
#                 is not a claim that both render every field identically.
#                 Where the two disagree today the file carries BOTH rows, each
#                 with its own data, so the disagreement is visible instead of
#                 silent. Converging a divergence is a capability decision and
#                 does not happen by editing this file.
#   group         the panel heading the row is drawn under
#   name          the card's title
#   what          one sentence, shown under the title
#   extra         optional tag tying the row to a feature area
#   import_name   the pip extra that installs the client it needs
#   setup_url     where a person gets the credential; "" when there is nowhere
#   reload        when a saved value takes effect: "live" | "agent" | "gateway"
#   env           the credential and switch fields, in the order the form shows
#                 them. name is the variable; label is the visible label; kind
#                 is "text" | "bool" | "choice" (omitted means text); default,
#                 options and option_labels belong to choice fields; required
#                 and secret are what they say; help is the note under the
#                 field.
#
# Order is the registration order. Filtered by `halves`, this file's order is
# each half's order, so both halves agree on the panel layout without either
# re-sorting.
#
# What is NOT here: `enabled`, `probe` and `normalize` are closures, so they
# live in code keyed by `key`. A row that says Python registers it and has no
# entry there fails loudly and names the key, rather than building a card that
# can never turn on.


[telegram]
halves = ["python", "nim"]
group = "Channels"
name = "Telegram"
what = "Lets Waku receive and send Telegram messages."
extra = "telegram"
import_name = "telegram"
setup_url = "https://t.me/BotFather"
reload = "gateway"

[[telegram.env]]
name = "TELEGRAM_BOT_TOKEN"
label = "Bot token"
required = true
secret = true

[[telegram.env]]
name = "TELEGRAM_ALLOWED_USER"
label = "Allowed user"

[discord]
halves = ["python", "nim"]
group = "Channels"
name = "Discord"
what = "Lets Waku answer in a Discord server."
extra = "discord"
import_name = "discord"
setup_url = ""
reload = "gateway"

[[discord.env]]
name = "DISCORD_BOT_TOKEN"
label = "Bot token"
required = true
secret = true

[[discord.env]]
name = "DISCORD_ALLOWED_USER"
label = "Allowed user"

[[discord.env]]
name = "DISCORD_ALLOWED_CHANNEL"
label = "Allowed channel"

[[discord.env]]
name = "DISCORD_REQUIRE_MENTION"
label = "Require mention"
kind = "bool"

[[discord.env]]
name = "DISCORD_MAX_TURNS_PER_HOUR"
label = "Max turns per hour"

[[discord.env]]
name = "DISCORD_HOME"
label = "Workspace directory"

