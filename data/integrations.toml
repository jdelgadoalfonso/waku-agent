kind = "bool"

[[gmail.env]]
name = "WAKU_GMAIL_SEND"
label = "Send for real"
kind = "bool"
help = "Off means gmail_send writes a draft to the outbox instead of sending. An email cannot be unsent, so real delivery is a separate switch."

