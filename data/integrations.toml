[[obsidian.env]]
name = "WAKU_EPISODIC_STORE"
label = "Episodic store"
kind = "choice"
default = "sqlite"
options = ["sqlite", "obsidian"]

[[obsidian.env]]
name = "WAKU_OBSIDIAN_VAULT"
label = "Vault path"
required = true
help = "Root of your local Obsidian vault. Episodes live under waku/episodes/."

[mem0]
halves = ["python", "nim"]
group = "Memory & Storage"
name = "Mem0"
what = "Stores semantic memory in the Mem0 service."
extra = "arena"
import_name = "mem0"
setup_url = ""
reload = "agent"

[[mem0.env]]
name = "WAKU_SEMANTIC_STORE"
label = "Semantic store"
kind = "choice"
default = "sqlite"
options = ["sqlite", "mem0"]

[[mem0.env]]
name = "MEM0_API_KEY"
label = "API key"
required = true
secret = true
help = "From app.mem0.ai. The adapter sends infer=False so add() always stores — a bake-off against it measures retrieval, not Mem0's own extraction step."

[[mem0.env]]
name = "MEM0_USER_ID"
label = "User id"
help = "Defaults to 'waku'. Change it only if several people share one Mem0 account."

[zep]
halves = ["python", "nim"]
group = "Memory & Storage"
name = "Zep"
what = "Stores semantic memory in a Zep temporal graph."
extra = "arena"
import_name = "zep_cloud"
setup_url = ""
reload = "agent"

[[zep.env]]
name = "WAKU_SEMANTIC_STORE"
label = "Semantic store"
kind = "choice"
default = "sqlite"
options = ["sqlite", "zep"]

[[zep.env]]
name = "ZEP_API_KEY"
label = "API key"
required = true
secret = true
help = "From getzep.com. Facts become graph edges with validity dates, so a correction supersedes the old value instead of ranking beside it — the one backend built for the update test."

[[zep.env]]
name = "ZEP_USER_ID"
label = "User id"
help = "Defaults to 'waku'. Zep scopes a graph per user."

[[zep.env]]
name = "ZEP_MAX_WAIT_SECONDS"
label = "Max wait (s)"
help = "Ingestion is asynchronous: graph.add returns in ~0.2s with the episode unprocessed, and the text is not searchable until Zep has turned it into nodes and edges. Waku polls until it has, up to this long. Default 120 — raise it if seeding times out, never lower it to make a benchmark finish."

[langmem]
halves = ["python", "nim"]
group = "Memory & Storage"
name = "LangMem"
what = "Stores semantic memory in a LangGraph store via LangMem."
extra = "arena"
import_name = "langmem"
setup_url = ""
reload = "agent"

[[langmem.env]]
name = "WAKU_SEMANTIC_STORE"
label = "Semantic store"
kind = "choice"
default = "sqlite"
options = ["sqlite", "langmem"]

[[langmem.env]]
name = "WAKU_LANGMEM_POSTGRES"
label = "Postgres URL"
help = "Optional. Without it LangGraph's InMemoryStore is used, which its own docs describe as a reference implementation whose data dies with the process — fine for a benchmark run, not a persistence story."

[[langmem.env]]
name = "OPENAI_API_KEY"
label = "OpenAI key"
required = true
secret = true
help = "LangMem has no key of its own; it bills through embeddings. Semantic search needs this or the store is a plain key-value dict."

[supabase]
halves = ["python", "nim"]
group = "Memory & Storage"
name = "Supabase"
what = "Stores semantic memory in Supabase pgvector."
extra = "supabase"
import_name = "supabase"
setup_url = ""
reload = "agent"

[[supabase.env]]
name = "WAKU_SEMANTIC_STORE"
label = "Semantic store"
kind = "choice"
default = "sqlite"
options = ["sqlite", "supabase"]

[[supabase.env]]
name = "SUPABASE_URL"
label = "Project URL"
required = true

[[supabase.env]]
name = "SUPABASE_SERVICE_KEY"
label = "Service key"
required = true
secret = true
help = "Embeddings also require OPENAI_API_KEY (optionally OPENAI_EMBED_MODEL)."

