# The Nim port's gate, in a workflow of its own. `hosted-docker` set the
# precedent: a tier that needs its own toolchain runs BESIDE `validate`, not
# inside it, so a community skill PR does not wait on a Nim download and every
# suite compile, and a red Nim build never gets read as a red skill. The
# triggers are `validate`'s — every PR and every push to main.
#
# Two jobs, because two builds: `nim-test-and-build` is the default build
# (no TLS in the transport, no OpenSSL needed) and `nim-tls` is the one
# behind `-d:ssl -d:wakuTls`. They do not share a step, because the point of
# the switch is that the default build never grows the dependency.
#
# `nimble install` is the only step that touches the network (it pulls
# db_connector and mimalloc_nim). The suite itself is offline and needs no API key, so this
# workflow has no secret to leak and no judge eval to skip.
name: nim

on:
  pull_request:
  push:
    branches: [main]

jobs:
  nim-test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Every command runs where a developer runs it. The suite's pins read
        # the checkout relative to the working directory (test_cli.nim walks
        # up to data/providers.toml), so `nimble test` from the repo root
        # would compile the suites and then fail on itself.
        working-directory: nim
    steps:
      - uses: actions/checkout@v4
      # The compiler this port is verified on, and the one
      # `requires "nim >= 2.0.0"` in waku.nimble asks for. Pinned rather than
      # "latest" so a Nim release cannot turn this gate red without a PR.
      - uses: jiro498/nim-toolchain-action@v1
        with:
          version: "2.3.1"
      # Dependencies only: db_connector, the stdlib db_sqlite successor, plus
      # mandatory mimalloc_nim (dynamic memory allocator). The
      # package itself is never installed — it is the thing being built.
      - name: Install dependencies
        run: nimble install -y --depsOnly
      - name: Offline suite
        run: nimble test
      # The build is in the gate on purpose: the dashboard assets are embedded
      # at compile time, so "the binary serves its frontend" is a claim only
      # a build can check, and an embed that came out empty (a missing
      # checkout) stays quiet until a browser asks for it.
      - name: Build the binary
        run: nimble build
      # The black-box suite runs the binary the step above built, which is
      # why it comes AFTER that step and not inside `nimble test`: run
      # there, a checkout with no binary yet would skip every process pin
      # and the gate would read green on nothing it built. Same compile
      # line `waku.nimble`'s `test` task uses, so the suite a developer
      # types is the suite this job runs.
      - name: Black-box suite
        run: nim c -r --hints:off tests/test_blackbox.nim

  # The live-TLS build, in a job of its own. A NEW job, not a new step
  # in the one above, for the reason this file exists at all: the
  # default build must not grow an OpenSSL dependency, so the two builds
  # are separate jobs and a failure in one is a failure about that one.
  # No existing step above was touched.
  #
  # Everything the suite needs is here: the checkout (the dashboard
  # assets embed at compile time), the same pinned compiler, the same two
  # dependencies, and the OpenSSL development headers — the ONLY thing
  # the default job does not need, and the reason this build cannot just
  # be a flag on the job above.
  #
  # The switches are not repeated in this file. `nimble buildTls` and
  # `nimble testTls` carry them, so a workflow that spelled out its own
  # `-d:` line is exactly how the manifest and CI would drift apart.
  nim-tls:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nim
    steps:
      - uses: actions/checkout@v4
      - uses: jiro498/nim-toolchain-action@v1
        with:
          version: "2.3.1"
      # The one package the default job does not install. `libssl-dev`
      # is headers only: the runtime library is already on the runner.
      - name: OpenSSL development headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Install dependencies
        run: nimble install -y --depsOnly
      # The TLS suite first: it is the pinned contract, and it fails
      # with a readable message where a compile error would not.
      - name: Live-TLS suite (offline)
        run: nimble testTls
      - name: Build the binary with live TLS
        run: nimble buildTls
